[project]
name = "echo-asr"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "espnet",
    "g2p-en>=2.1.0",
    "jiwer>=4.0.0",
    "numpy>=2.4.6",
    "openai-whisper>=20240930",
    "panphon>=0.22.2",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "spacy>=3.8.15",
    "statsmodels>=0.14.6",
    "torch>=2.13.0,<2.14",
    "torchaudio>=2.11.0,<2.12",
    "tqdm>=4.70.0",
    # engine no longer uses transformers; kept only for EnglishTextNormalizer({}) in
    # normalize.py (whisper's own normalizer hardcodes the spelling mapping, ours is
    # pinned empty and the frozen metric numbers depend on it)
    "transformers>=5.14.1,<5.15",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "ipython>=9.16.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
llm = [
    "anthropic>=0.121.0",
    "python-dotenv>=1.2.2",
]

# espnet is the fork we sit inside, installed editable so engine code and any
# espnet2 patches on the echo-asr branch are picked up directly
[tool.uv.sources]
espnet = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# espnet caps setuptools at <74 while torch>=2.13 needs >=77; the cap guards legacy
# pkg_resources paths our inference-only surface does not exercise
override-dependencies = ["setuptools>=77.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: needs model downloads or real inference"]

[tool.ruff]
line-length = 100
target-version = "py311"
